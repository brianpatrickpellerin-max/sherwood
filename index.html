<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sherwood">
<meta name="theme-color" content="#0d160a">
<meta name="format-detection" content="telephone=no">
<title>Outlaws of Sherwood</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="titlebg" class="hidden"></canvas>

<div id="hud" class="hidden">
  <div id="topbar">
    <div id="minibox" role="button" aria-label="Map: tap to look there">
      <canvas id="minimap"></canvas>
      <div id="money"><span>Money</span><b id="moneyv">0</b></div>
    </div>
    <div id="objbox" role="button" aria-label="Objectives">
      <div id="mtitle"></div>
      <div id="objlist"></div>
    </div>
    <div id="topbtns">
      <button id="btnPause" class="iconbtn big" aria-label="Pause"><span class="pz"></span></button>
      <button id="btnSound" class="iconbtn" aria-label="Sound">🔇</button>
    </div>
  </div>
  <div id="tip" class="hidden"><div id="tiptext"></div><button id="tipok">Got it</button></div>
  <div id="toasts"></div>
  <div id="target" class="hidden"><span id="targettext"></span><button id="targetcancel">✕ Cancel</button></div>
  <div id="pausedbar" class="hidden"><span>Paused: plan your moves</span><button id="btnResume2">▶ Resume</button></div>
  <div id="bottom">
    <div id="actions"></div>
    <div id="bar"><div id="portraits"></div></div>
  </div>
  <div id="ctxmenu" class="hidden"></div>
</div>

<div id="screen" class="hidden"><div id="screenInner"></div></div>
<div id="rotate-hint" class="hidden"></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/missions.js"></script>
<script src="js/ambush.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/iso.js"></script>
<script src="js/render.js"></script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
